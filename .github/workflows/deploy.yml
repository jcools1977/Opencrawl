name: Test & Deploy ConvoYield Cloud

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-cloud.txt
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy convoyield \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "\
          DATABASE_URL=${{ secrets.DATABASE_URL }},\
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},\
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},\
          STRIPE_PRICE_PRO=${{ secrets.STRIPE_PRICE_PRO }},\
          STRIPE_PRICE_ENTERPRISE=${{ secrets.STRIPE_PRICE_ENTERPRISE }},\
          STRIPE_PRICE_SAAS_SALES=${{ secrets.STRIPE_PRICE_SAAS_SALES }},\
          STRIPE_PRICE_ECOMMERCE=${{ secrets.STRIPE_PRICE_ECOMMERCE }},\
          STRIPE_PRICE_REAL_ESTATE=${{ secrets.STRIPE_PRICE_REAL_ESTATE }},\
          STRIPE_PRICE_HEALTHCARE=${{ secrets.STRIPE_PRICE_HEALTHCARE }},\
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},\
          FROM_EMAIL=${{ secrets.FROM_EMAIL }},\
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }},\
          BASE_URL=${{ secrets.BASE_URL }}"
